# ─────────────────────────────────────────────────────────────────────────────
# project.ini — Traffic Violation Detection System Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Multi-camera mode: add one [camera_N] section per camera.
# Single-camera legacy mode: keep only [camera_0].
# Original single-camera settings are preserved in project.ini.bak
# ─────────────────────────────────────────────────────────────────────────────

# ── Shared model weights ──────────────────────────────────────────────────────
[load_model]
model_vehicle_detect      = weights/vehicle_detect.pt
model_plate_detect        = weights/plate_detect.pt
model_plate_number_detect = weights/plate_number_detect.pt
model_helmet_detect       = weights/helmet.pt
# OSNet Re-ID weights (downloaded automatically on first run if file missing)
model_reid                = weights/osnet_x1_0_vehicleid.pth

# ── Camera 0 (original single-camera setup) ───────────────────────────────────
[camera_0]
video      = source_videos/moto.mp4
mask       = source_images/maskmoto.png
# Violation trigger line (x1,y1 → x2,y2)
linex1     = 934
liney1     = 300
linex2     = 934
liney2     = 1080
# Physical position in metres (used for spatio-temporal scoring)
position_x = 0.0
position_y = 0.0

# ── Camera 1 ──────────────────────────────────────────────────────────────────
[camera_1]
video      = source_videos/cam1.mp4
mask       = source_images/mask.png
linex1     = 120
liney1     = 380
linex2     = 880
liney2     = 380
position_x = 500.0
position_y = 0.0

# ── Camera 2 (optional — uncomment to enable) ─────────────────────────────────
# [camera_2]
# video      = source_videos/cam2.mp4
# mask       = source_images/mask.png
# linex1     = 100
# liney1     = 400
# linex2     = 900
# liney2     = 400
# position_x = 1000.0
# position_y = 0.0

# ── Output ────────────────────────────────────────────────────────────────────
[destination]
save_image = output_data

# ── Graphic settings ──────────────────────────────────────────────────────────
[graphic_setting]
show_vehicle_detect = true
show_tracking       = true
show_helmet         = false

# ── Global tracker hyper-parameters ──────────────────────────────────────────
[global_tracker]
# Minimum S_total to link a tracklet to an existing gallery entry
match_threshold          = 0.50
# OCR confidence above which the plate signal dominates
lpr_confidence_threshold = 0.80
# Weights when plate is clearly visible  (reid, lpr, st)
weights_plate_visible    = 0.30, 0.50, 0.20
# Weights when plate is hidden / low confidence
weights_plate_hidden     = 0.70, 0.00, 0.30
# Average vehicle speed (m/s) for spatio-temporal scoring  (~50 km/h)
avg_speed_mps            = 14.0
# Gaussian sigma (seconds) for spatio-temporal scoring
st_sigma                 = 30.0
# Seconds before an inactive gallery entry is pruned
gallery_ttl              = 3600
